name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build fake SubSource executable
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/target/debug | Out-Null
          rustc src-tauri/tests/fake_subsource.rs -o src-tauri/target/debug/fake_subsource.exe --edition 2021

      - name: Build fake 7-Zip executable
        run: rustc src-tauri/tests/fake_7z.rs -o src-tauri/target/debug/fake_7z.exe --edition 2021

      - name: Rust integration tests (SubSource CLI)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test integration_subsource_cli

      - name: Rust integration tests (SubSource Staging & Batch Download)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test integration_subsource_download

      - name: Rust integration tests (Archive Extraction & Episode Matching)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test integration_archive_extraction

      - name: Build debug binary (smoke)
        run: cargo build --manifest-path src-tauri/Cargo.toml
