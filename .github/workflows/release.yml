name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Tests before release
        working-directory: src-tauri
        run: cargo test

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Rename installer with tag
        shell: pwsh
        run: |
          # نام خروجی NSIS از نسخهٔ tauri.conf.json می‌آید — بدون مسیر هاردکد
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $exe = "src-tauri/target/release/bundle/nsis/SubSync Studio_$($conf.version)_x64-setup.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          $tag = "${{ github.ref_name }}"
          Copy-Item $exe "SubSync-Studio_${tag}_x64-setup.exe"

      - name: Compute SHA256 of the final installer
        shell: pwsh
        run: |
          # checksum با نام نهایی asset — sha256sum -c مستقیماً کار می‌کند
          $file = "SubSync-Studio_${{ github.ref_name }}_x64-setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          "$hash  $file" | Out-File -Encoding ascii "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SubSync Studio ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            SubSync-Studio_${{ github.ref_name }}_x64-setup.exe
            SHA256SUMS.txt
