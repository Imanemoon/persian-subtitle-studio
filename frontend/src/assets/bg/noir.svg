<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- نوآر: سایهٔ کرکبهٔ پنجره و دود -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a0d"/>
      <stop offset="1" stop-color="#0b0f13"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3d8" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#cfe3d8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9f2e6" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#d9f2e6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d9f2e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="smoke" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0.9 -0.55"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <circle cx="1150" cy="280" r="520" fill="url(#lamp)"/>
  <!-- سایهٔ کرکبه — نوارهای مورب -->
  <g transform="rotate(-14 800 450)">
    <g fill="#010304">
      <rect x="-200" y="60"  width="2000" height="46"/>
      <rect x="-200" y="170" width="2000" height="46"/>
      <rect x="-200" y="280" width="2000" height="46"/>
      <rect x="-200" y="390" width="2000" height="46"/>
      <rect x="-200" y="500" width="2000" height="46"/>
      <rect x="-200" y="610" width="2000" height="46"/>
      <rect x="-200" y="720" width="2000" height="46"/>
      <rect x="-200" y="830" width="2000" height="46"/>
    </g>
    <g fill="url(#stripe)">
      <rect x="-200" y="106" width="2000" height="64"/>
      <rect x="-200" y="216" width="2000" height="64"/>
      <rect x="-200" y="326" width="2000" height="64"/>
      <rect x="-200" y="436" width="2000" height="64"/>
      <rect x="-200" y="546" width="2000" height="64"/>
      <rect x="-200" y="656" width="2000" height="64"/>
      <rect x="-200" y="766" width="2000" height="64"/>
    </g>
  </g>
  <rect width="1600" height="900" filter="url(#smoke)" opacity="0.65"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
